<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tell StartValidate AI about your startup idea.">
  <title>Startup Idea | StartValidate AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="idea-input.css">
  <link rel="stylesheet" href="css/global.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="StartValidate AI home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" role="img">
          <path d="M16.8 4.4c4.1-.9 7.3.1 9.5 2.1.1 2.8-.8 5.5-2.7 8l-6.5 8.2-6.2-6.2 8.2-6.5c2.5-1.9 5.2-2.8 8-2.7" fill="#6875e9" opacity=".22"/>
          <path d="M16.8 4.4c4.1-.9 7.3.1 9.5 2.1.1 2.8-.8 5.5-2.7 8l-6.5 8.2-6.2-6.2 8.2-6.5c2.5-1.9 5.2-2.8 8-2.7" fill="none" stroke="#5060d9" stroke-width="1.7" stroke-linejoin="round"/>
          <circle cx="20.7" cy="10.2" r="2" fill="#5060d9"/>
          <path d="m10.9 16.5-4.7 1.4 1.4-4.7m3.6 9.1-1.8 4.2 4.2-1.8" fill="none" stroke="#5060d9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span>StartValidate <strong>AI</strong></span>
    </a>

  </header>

  <main class="page-shell">
    <section class="onboarding" aria-labelledby="page-title">


      <form class="idea-form" id="idea-form" novalidate>
        <div class="form-heading">
          <h1 id="page-title">Tell us about your startup</h1>
          <p>Let's understand your idea first.</p>
        </div>
        <label class="field-label" for="startup-idea">Startup idea</label>
        <textarea id="startup-idea" name="startup-idea" rows="5" placeholder="Describe your startup idea here..." aria-describedby="idea-example idea-error"></textarea>
        <p class="example-text" id="idea-example">Example: A platform connecting local home chefs<br class="mobile-break"> with nearby customers.</p>
        <p class="error-message" id="idea-error" role="alert" aria-live="polite"></p>
        <div class="form-actions">
          <button class="continue-button" type="submit">Continue <span aria-hidden="true">→</span></button>
        </div>
      </form>
    </section>
  </main>

  <script src="idea-input.js"></script>
</body>
</html>
