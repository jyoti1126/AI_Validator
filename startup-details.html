<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Startup details for StartValidate AI.">
  <title>Startup Details | StartValidate AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="startup-details.css">
  <link rel="stylesheet" href="css/global.css">
</head>
<body>
  <main class="page-shell">
    <section class="startup-header" aria-labelledby="startup-title">
      <div class="startup-summary">
        <div class="startup-image" role="img" aria-label="Homemade achar placeholder"><span>🥭</span><i>●</i><b>●</b></div>
        <div class="startup-info">
          <h1 class="startup-title" id="startup-title">Homemade Achar Business</h1>
          <p class="startup-description" id="startup-description">A platform connecting local home chefs with nearby customers.</p>
          <div class="startup-meta" aria-label="Startup details">
            <span class="meta-badge"><span aria-hidden="true">⌂</span><span id="startup-category">Food &amp; Beverage</span></span>
            <span class="meta-badge"><span aria-hidden="true">₹</span><span id="startup-budget">₹10,000</span></span>
            <span class="meta-badge"><span aria-hidden="true">◷</span><span id="startup-time">10 hours/week</span></span>
          </div>
        </div>
      </div>
      <button class="edit-button" id="edit-button" type="button"><span aria-hidden="true">✎</span> Edit</button>
    </section>

    <nav class="startup-tabs" aria-label="Startup details navigation">
      <a class="tab active" href="startup-details.html" aria-current="page">Overview</a>
      <a class="tab" href="overview.html">Report</a>
      <a class="tab" href="progress.html">Progress</a>
      <a class="tab" href="profile.html">Settings</a>
    </nav>
  </main>

  <script src="startup-details.js"></script>
</body>
</html>
