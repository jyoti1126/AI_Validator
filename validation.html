<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="StartValidate AI is validating your startup idea.">
  <title>Validating Idea | StartValidate AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="validation.css">
  <link rel="stylesheet" href="css/global.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="StartValidate AI home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" role="img">
          <path d="M16.8 4.4c4.1-.9 7.3.1 9.5 2.1.1 2.8-.8 5.5-2.7 8l-6.5 8.2-6.2-6.2 8.2-6.5c2.5-1.9 5.2-2.8 8-2.7" fill="#6875e9" opacity=".22"/>
          <path d="M16.8 4.4c4.1-.9 7.3.1 9.5 2.1.1 2.8-.8 5.5-2.7 8l-6.5 8.2-6.2-6.2 8.2-6.5c2.5-1.9 5.2-2.8 8-2.7" fill="none" stroke="#5060d9" stroke-width="1.7" stroke-linejoin="round"/>
          <circle cx="20.7" cy="10.2" r="2" fill="#5060d9"/>
          <path d="m10.9 16.5-4.7 1.4 1.4-4.7m3.6 9.1-1.8 4.2 4.2-1.8" fill="none" stroke="#5060d9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span>StartValidate <strong>AI</strong></span>
    </a>
  </header>

  <main class="validation-page">
    <section class="validation-content" aria-labelledby="validation-title">
      <div class="ai-orbit" aria-hidden="true">
        <div class="ai-glow"></div>
        <div class="ai-robot">
          <span class="robot-antenna"></span>
          <span class="robot-face"><i></i><i></i><b></b></span>
        </div>
      </div>

      <h1 id="validation-title">AI is validating your idea...</h1>
      <p class="validation-subtitle" id="validation-subtitle">This may take a few moments. Please wait.</p>

      <ol class="validation-list" aria-label="Validation progress">
        <li class="validation-step is-current"><span class="status-icon" aria-hidden="true"></span><span>Understanding your idea</span></li>
        <li class="validation-step"><span class="status-icon" aria-hidden="true"></span><span>Identifying target customers</span></li>
        <li class="validation-step"><span class="status-icon" aria-hidden="true"></span><span>Analyzing market opportunity</span></li>
        <li class="validation-step"><span class="status-icon" aria-hidden="true"></span><span>Checking competition</span></li>
        <li class="validation-step"><span class="status-icon" aria-hidden="true"></span><span>Evaluating business model</span></li>
        <li class="validation-step"><span class="status-icon" aria-hidden="true"></span><span>Finding potential risks</span></li>
      </ol>
    </section>
  </main>

  <script src="validation.js"></script>
</body>
</html>
